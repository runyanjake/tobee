services:
  tobee:
    build: .
    env_file: .env
    volumes:
      # Live-reloadable prompts.
      - ./prompts:/app/prompts
      # Persist the agent's memory + session summaries across restarts.
      - ./data:/app/data
    extra_hosts:
      # Allows the container to reach LM Studio on the host machine.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
