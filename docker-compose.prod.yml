# Production deployment for the Linux server with an Nvidia GPU.
#
#   cp .env.prod.example .env.prod   # fill in DISCORD_TOKEN, pick AI_MODEL
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requires the host to have the Nvidia driver + nvidia-container-toolkit
# installed and the Docker runtime configured for GPUs:
#   https://docs.nvidia.com/datacenter/cloud-native/container-toolkit/latest/install-guide.html
#
# Unlike docker-compose.yml (dev: points at LM Studio on the host), this
# bundles Ollama as a GPU-backed sidecar and routes tobee's LLM calls to it.
services:
  # GPU-backed LLM server. Speaks the OpenAI-compatible API tobee's client
  # expects at /v1/chat/completions on port 11434.
  ollama:
    image: ollama/ollama:latest
    # Sourced for OLLAMA_KEEP_ALIVE; unrelated tobee vars here are harmless.
    # required:false so read-only commands (ps/logs/down) still work after the
    # CI job has removed .env.prod; `up`/`config` validate values separately.
    env_file:
      - path: .env.prod
        required: false
    volumes:
      # Persist pulled models so a restart doesn't re-download gigabytes.
      - ollama-models:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  # One-shot: pull the configured model into Ollama, then exit. tobee waits
  # on this completing so the first turn doesn't 404 on a missing model.
  ollama-pull:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    env_file:
      - path: .env.prod
        required: false
    environment:
      - OLLAMA_HOST=ollama:11434
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$${AI_MODEL}\""]
    restart: "no"

  tobee:
    build: .
    env_file:
      - path: .env.prod
        required: false
    depends_on:
      ollama:
        condition: service_healthy
      ollama-pull:
        condition: service_completed_successfully
    volumes:
      # Prompts are baked into the image at build time (Dockerfile:
      # COPY prompts ./prompts). No host bind mount — prod ships one
      # image built with one set of prompts, and prompt changes ride in
      # on a rebuild. Dev compose still bind-mounts them for live edit.
      #
      # tobee's "brain": memory and scheduler jobs. Lives outside the repo
      # on the prod host so it survives redeploys and is editable in
      # place. Create the directory on the server before first run:
      #   sudo mkdir -p /pwspool/software/tobee && sudo chown $(id -u):$(id -g) /pwspool/software/tobee
      - /pwspool/software/tobee:/app/data
    restart: unless-stopped

volumes:
  ollama-models:
